name: sonar/scan
description: >-
  Run a SonarQube Cloud scan on a JDK at or above the version SonarSource requires, with
  the scanner's own JRE provisioning disabled. Supplies that JDK unless the one already on
  JAVA_HOME is the version asked for.

# Metadata only. No Marketplace listing is published, and none could be: a listing
# requires action.yml at the repository root, which every action here deliberately
# avoids (see CONTRIBUTING.md, "Never put an action.yml at the repository root").
branding:
  icon: shield
  color: blue

# Inputs are added one at a time, named, when a consumer actually needs them. An argument
# passthrough is what this action exists to remove: a consumer who can append scanner
# arguments is back to fixing their own repository the next time SonarSource raises the
# floor. Adding an optional input is not a breaking change (CONTRIBUTING.md, "Breaking
# changes"); removing one is, so the interface stays narrow.
#
# Per-project analysis configuration belongs in the consumer's sonar-project.properties,
# not in an argument list here. See README.md.
inputs:
  sonar-token:
    description: >-
      SonarCloud token. Pass the repository's SONAR_TOKEN secret. Required and passed
      explicitly because the `secrets` context is unavailable inside a composite action.
    required: true
  java-version:
    description: >-
      Feature version of the JDK the scan runs on. The default is the floor SonarSource
      enforces. A job that already has this version on JAVA_HOME keeps it, whatever the
      distribution. Any other request installs Temurin and repoints JAVA_HOME at it for
      the remainder of the job. A range or a floating version always installs.
    required: false
    default: '21'

runs:
  using: composite
  steps:
    # The guard lives in its own file so it can be tested without running the action -
    # see the script's own comment, and the token-required job in
    # .github/workflows/sonar-scan-test.yml.
    - name: Require a token
      shell: bash
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      run: bash "$GITHUB_ACTION_PATH/require-token.sh"

    # setup-java resolves a request against the runner tool cache alone, so a JDK from
    # SDKMAN or apt is invisible to it and gets shadowed by a second copy of that version.
    - name: Check the JDK on JAVA_HOME
      id: jdk
      shell: bash
      env:
        REQUESTED: ${{ inputs.java-version }}
      run: bash "$GITHUB_ACTION_PATH/jdk-satisfied.sh"

    # The default is Java 21 since 2026-07-20, the floor SonarSource enforces for a scanner
    # runtime with JRE auto-provisioning disabled. A scanner CLI bump can raise it again,
    # and the default is then the single edit that moves every consumer who passes no
    # version - which is the whole point of the action.
    #
    # Supplying the JDK is what lets the scan skip JRE provisioning below. Temurin is in
    # the hosted image's tool cache, so a cached version resolves in about a second and
    # downloads nothing; auto-provisioning instead fetches a JRE into ~/.sonar/cache, which
    # is ephemeral on a hosted runner and so re-downloaded on every single run.
    #
    # Running this step sets JAVA_HOME for the remainder of the caller's job, not just this
    # action. Call the action after any step that needs a different JDK, or name that JDK
    # here.
    - name: Set up JDK
      if: steps.jdk.outputs.satisfied != 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # skipJreProvisioning is what makes the JDK above the one the scan runs on, and is
    # also what makes the hardcoded version load-bearing: with provisioning on, the
    # scanner would ignore that JDK and the Java floor could never fail a build.
    #
    # The argument list is fixed. Nothing a caller supplies is appended to it, so the flag
    # cannot be overridden back to false.
    - name: SonarQube Cloud Scan
      uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
      with:
        args: -Dsonar.scanner.skipJreProvisioning=true
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}

name: aws/assume-role test

# Exercises the aws/assume-role composite action.
#
# Unlike the other action tests here, the core path cannot be tested offline: assuming a role
# IS what this action does. So one job assumes a real role - `gha-actions-oidc-test`, which
# has NO permissions policy attached and whose trust policy names only this repository's
# `sub`. `sts:GetCallerIdentity` requires no IAM permission, which is what lets an empty role
# serve as a complete test target. Never attach a policy to it: `sub` is the whole boundary
# there, and that is only sound while the role grants nothing.
#
# us-east-1 is hardcoded. STS is reachable in every region and an IAM role is
# region-independent, so the suite needs no second secret or variable for it.
#
# Every job that needs an OIDC token is gated on the pull request coming from this
# repository. A fork pull request is granted neither `id-token: write` nor secrets, so those
# jobs would fail for a reason that is not a defect. A fork still runs input-validation,
# which needs neither - and the aggregate job below treats a skipped job as a pass.
#
# Deliberately NOT path-filtered. These tests gate the merge via the
# aws-assume-role-tests-pass job below, and a path-filtered workflow cannot do that: when the
# filter excludes a PR its checks stay Pending rather than passing, so a required check over
# a filtered workflow deadlocks the pull request permanently.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No credentials and no token: the guard is a standalone script precisely so every case is
  # reachable this way. This job also pins the action's security-relevant defaults, which are
  # the settings a well-meaning edit is most likely to flip.
  input-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the guard accepts a well-formed set
        run: |
          set -euo pipefail
          guard=aws/assume-role/validate-inputs.sh

          # env -i so no runner variable leaks in - in particular
          # ACTIONS_ID_TOKEN_REQUEST_URL, whose absence is one of the cases below.
          ok() {
            local label="$1"; shift
            if ! env -i PATH="$PATH" "$@" bash "$guard" >/dev/null; then
              echo "expected the guard to accept $label" >&2
              exit 1
            fi
            echo "accepted: $label"
          }

          ok 'the default-shaped set' \
            INPUT_AWS_ROLE_ARN='arn:aws:iam::000000000000:role/example' \
            INPUT_AWS_REGION='eu-north-1' \
            INPUT_AUDIENCE='sts.amazonaws.com' \
            INPUT_SESSION_DURATION='900' \
            INPUT_SHOW_CLAIMS='false' \
            ACTIONS_ID_TOKEN_REQUEST_URL='https://example.invalid/token'

          # The partition is not hardcoded: the check requires an ARN, not one partition.
          ok 'an aws-cn ARN' \
            INPUT_AWS_ROLE_ARN='arn:aws-cn:iam::000000000000:role/example' \
            INPUT_AWS_REGION='cn-north-1' \
            INPUT_AUDIENCE='sts.amazonaws.com' \
            INPUT_SESSION_DURATION='43200' \
            INPUT_SHOW_CLAIMS='true' \
            ACTIONS_ID_TOKEN_REQUEST_URL='https://example.invalid/token'

      - name: Assert the guard refuses each bad input
        run: |
          set -euo pipefail
          guard=aws/assume-role/validate-inputs.sh

          # Each case states only what it changes from the valid set above.
          bad() {
            local label="$1" want="$2"; shift 2
            local out exit_status
            set +e
            out="$(env -i PATH="$PATH" "$@" bash "$guard" 2>&1 >/dev/null)"
            exit_status=$?
            set -e
            if [[ "$exit_status" -ne 1 ]]; then
              echo "expected the guard to exit 1 for $label, got: $exit_status" >&2
              exit 1
            fi
            if [[ "$out" != *"$want"* ]]; then
              echo "expected '$want' on stderr for $label, got: $out" >&2
              exit 1
            fi
            echo "refused $label: $out"
          }

          base_region='eu-north-1'
          base_audience='sts.amazonaws.com'
          base_duration='900'
          base_claims='false'
          base_url='https://example.invalid/token'
          good_arn='arn:aws:iam::000000000000:role/example'

          bad 'an empty aws-role-arn' 'aws-role-arn is empty' \
            INPUT_AWS_ROLE_ARN='' INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'a whitespace-only aws-role-arn' 'aws-role-arn is empty' \
            INPUT_AWS_ROLE_ARN='   ' INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          # The case the ARN check exists for: upstream would accept this and resolve it
          # against the source account.
          bad 'a bare role name' 'must be a full IAM role ARN' \
            INPUT_AWS_ROLE_ARN='gha-actions-oidc-test' INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'an ARN with an 11-digit account id' 'must be a full IAM role ARN' \
            INPUT_AWS_ROLE_ARN='arn:aws:iam::00000000000:role/example' \
            INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'a user ARN' 'must be a full IAM role ARN' \
            INPUT_AWS_ROLE_ARN='arn:aws:iam::000000000000:user/example' \
            INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'an uppercase region' 'aws-region must match' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION='EU-NORTH-1' \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'an empty region' 'aws-region must match' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION='' \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'an empty audience' 'audience is empty' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE='' INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'a non-numeric session-duration' 'whole number of seconds' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION='15m' \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'a session-duration below the AWS minimum' 'between 900 and 43200' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION='300' \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          bad 'a session-duration above the AWS maximum' 'between 900 and 43200' \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION='50000' \
            INPUT_SHOW_CLAIMS="$base_claims" ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          # Anything other than true/false would read as false in the step's `if:`, which
          # would silently disable the dump rather than fail.
          bad 'a non-boolean show-claims' "show-claims must be 'true' or 'false'" \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS='yes' ACTIONS_ID_TOKEN_REQUEST_URL="$base_url"

          # The most common misconfiguration: a caller that forgot the permission.
          bad 'a missing id-token permission' "needs 'permissions: id-token: write'" \
            INPUT_AWS_ROLE_ARN="$good_arn" INPUT_AWS_REGION="$base_region" \
            INPUT_AUDIENCE="$base_audience" INPUT_SESSION_DURATION="$base_duration" \
            INPUT_SHOW_CLAIMS="$base_claims"

      # These four lines are the action's security posture. Each is unique in the manifest,
      # so an exact-line match is an unambiguous assertion and needs no YAML tooling.
      - name: Assert the security-relevant defaults are unchanged
        run: |
          set -euo pipefail
          manifest=aws/assume-role/action.yml
          expected=(
            "    default: 'false'"
            "        output-env-credentials: false"
            "        output-credentials: true"
            "        mask-aws-account-id: true"
          )
          for line in "${expected[@]}"; do
            count="$(grep -Fxc -- "$line" "$manifest" || true)"
            if [[ "$count" != "1" ]]; then
              echo "expected exactly one '$line' in $manifest, found $count" >&2
              exit 1
            fi
            echo "ok: $line"
          done

  # Runs the dump script directly, which is the only way to assert what it prints: a job
  # cannot read its own log.
  claims:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the dump decodes the payload and prints no token
        env:
          INPUT_AUDIENCE: sts.amazonaws.com
        run: |
          set -euo pipefail
          out="$(bash aws/assume-role/show-claims.sh)"

          # Drop the script's own header line; the rest must be the claim object.
          claims="$(printf '%s\n' "$out" | tail -n +2)"
          printf '%s' "$claims" | jq -e . >/dev/null

          for claim in sub aud job_workflow_ref repository workflow_ref; do
            if ! printf '%s' "$claims" | jq -e --arg c "$claim" 'has($c)' >/dev/null; then
              echo "expected the claims to include $claim" >&2
              exit 1
            fi
          done

          if [[ "$(printf '%s' "$claims" | jq -r .aud)" != "sts.amazonaws.com" ]]; then
            echo "expected aud to be the requested audience" >&2
            exit 1
          fi

          # A JWT segment is base64url of JSON and so begins `eyJ`. Its absence anywhere in
          # the output is the assertion that no token, and no segment of one, was printed.
          if printf '%s' "$out" | grep -q 'eyJ'; then
            echo "the output contains what looks like a JWT segment" >&2
            exit 1
          fi
          echo "payload decoded, no token in the output"

  # The real exchange, against a role that can do nothing but answer GetCallerIdentity.
  assume-role:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assume the test role with the action's defaults
        id: assume
        uses: ./aws/assume-role
        with:
          aws-role-arn: ${{ secrets.AWS_OIDC_TEST_ROLE_ARN }}
          aws-region: us-east-1

      - name: Assert the three credentials came back
        env:
          KEY_ID: ${{ steps.assume.outputs.aws-access-key-id }}
          SECRET: ${{ steps.assume.outputs.aws-secret-access-key }}
          TOKEN: ${{ steps.assume.outputs.aws-session-token }}
          EXPIRY: ${{ steps.assume.outputs.aws-expiration }}
        run: |
          set -euo pipefail
          for name in KEY_ID SECRET TOKEN EXPIRY; do
            if [[ -z "${!name}" ]]; then
              echo "expected the action to output $name" >&2
              exit 1
            fi
          done
          echo "all four outputs are present"

      - name: Assert the credentials name the test role
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.assume.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.assume.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.assume.outputs.aws-session-token }}
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          # Not printed: it carries the account id. The role name is the assertion.
          case "$arn" in
            *":assumed-role/gha-actions-oidc-test/"*) ;;
            *) echo "the session does not name gha-actions-oidc-test" >&2; exit 1 ;;
          esac
          echo "the session is gha-actions-oidc-test"

      # The proof that output-env-credentials: false holds. A separate step, because the step
      # above sets these deliberately in its own scope.
      - name: Assert no credentials reached the job environment
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            if printenv "$name" >/dev/null 2>&1; then
              echo "$name leaked into the job environment" >&2
              exit 1
            fi
          done
          echo "no AWS_* credential is set in the job environment"

      # The opted-in path. Whether the claims actually printed is read from this job's log by
      # eye; what is asserted here is that the gated step does not break the exchange.
      - name: Assume the test role with the claims dump on
        id: verbose
        uses: ./aws/assume-role
        with:
          aws-role-arn: ${{ secrets.AWS_OIDC_TEST_ROLE_ARN }}
          aws-region: us-east-1
          show-claims: 'true'
          session-duration: '1200'
          session-name: aws-assume-role-test

      - name: Assert the opted-in call also returned credentials
        env:
          KEY_ID: ${{ steps.verbose.outputs.aws-access-key-id }}
        run: |
          set -euo pipefail
          [[ -n "$KEY_ID" ]] || { echo "expected credentials from the verbose call" >&2; exit 1; }
          echo "the show-claims path returned credentials too"

  # A well-formed ARN that cannot be assumed: validation passes, STS refuses, and the action
  # fails. What this pins is that the failure comes from the exchange rather than the guard.
  # The hint the action prints is a ::notice:: read from the log by eye - a job cannot read
  # its own log, so the text itself is not asserted here.
  failure-hint:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Try to assume a role that does not exist
        id: unassumable
        continue-on-error: true
        uses: ./aws/assume-role
        with:
          aws-role-arn: arn:aws:iam::000000000000:role/aws-assume-role-test-does-not-exist
          aws-region: us-east-1

      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.unassumable.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an unassumable role to fail the action, got: $OUTCOME" >&2
            exit 1
          fi
          echo "the action refused an unassumable role"

  aws-assume-role-tests-pass:
    if: always()
    needs:
      - input-validation
      - claims
      - assume-role
      - failure-hint
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" != "false" || "$CANCELLED" != "false" ]]; then
            echo "aws/assume-role tests did not all pass (failed=$FAILED cancelled=$CANCELLED)" >&2
            exit 1
          fi

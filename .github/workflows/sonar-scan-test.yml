name: sonar/scan test

# Exercises the sonar/scan composite action's token guard, its JDK probe and the JDK it
# sets up. That is the whole of what this workflow can assert offline.
#
# It asserts which JDK reaches JAVA_HOME, not whether the scanner accepts it, and no job
# here runs an analysis. With JRE provisioning skipped the scanner enforces its own floor
# against the JDK the action supplies, and only a real scan evaluates that. sonarcloud.yml
# is therefore the acceptance test: it runs this same action against this repository on every pull request with a real
# token, and it is what fails when SonarSource raises the floor again - as happened at
# sonarqube-scan-action 8.4.0, when the bundled SonarScanner CLI moved to 21 and broke three
# repositories. An offline assertion on `java -version` cannot do that job: it reports green
# whatever the scanner would have made of that JDK. What it can do is prove that the JDK
# the action leaves on JAVA_HOME is the one a consumer asked for, and that a JDK already
# there is kept rather than replaced - the jdk-probe and java-version jobs below.
#
# SONAR_HOST_URL points every job at the discard port on localhost, so the scanner's first
# call fails to connect and nothing leaves the runner - no token is needed, no SonarCloud
# project is written to, and a fork pull request can reach nothing.
#
# That guaranteed failure is also why the token guard is tested by running its script
# directly: an assertion on the action's outcome cannot distinguish a rejected token from
# the connection failure that follows a good one.
#
# Deliberately NOT path-filtered. These tests gate the merge via the
# sonar-scan-tests-pass job below, and a path-filtered workflow cannot do that: when the
# filter excludes a PR its checks stay Pending rather than passing, so a required check
# over a filtered workflow deadlocks the pull request permanently.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Port 9 is discard. The scanner fails to connect here before it would reach
  # SonarCloud, which keeps the suite offline and fast. Job-level env reaches a composite
  # action's own steps, which is how this takes effect inside the action.
  SONAR_HOST_URL: http://127.0.0.1:9

jobs:
  # GitHub does not enforce `required: true` for a composite action's inputs, so this
  # asserts the action's own guard. Without it an unset secret reaches the scanner as an
  # empty string and fails as a SonarCloud credentials error instead of a workflow one.
  #
  # The guard's script is run directly here. Asserting on the action's outcome would prove
  # nothing on its own: the discard port fails the scan step for every token, so the
  # action's outcome is failure either way. The step after it covers the wiring.
  token-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the guard rejects an empty token
        run: |
          set -euo pipefail
          guard=sonar/scan/require-token.sh
          expected="sonar/scan: sonar-token is empty - pass the SONAR_TOKEN secret."

          # Unset, empty and whitespace-only must all be refused; a value must pass.
          for token in '__unset__' '' '   '; do
            if [[ "$token" == '__unset__' ]]; then
              set +e; stderr="$(env -u SONAR_TOKEN bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label='unset'
            else
              set +e; stderr="$(SONAR_TOKEN="$token" bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label="'$token'"
            fi
            if [[ "$status" -ne 1 ]]; then
              echo "expected the guard to exit 1 for a $label token, got: $status" >&2
              exit 1
            fi
            if [[ "$stderr" != *"$expected"* ]]; then
              echo "expected the guard's message on stderr for a $label token, got: $stderr" >&2
              exit 1
            fi
            echo "refused a $label token: $stderr"
          done

          if ! SONAR_TOKEN=a-token bash "$guard"; then
            echo "the guard rejected a non-empty token" >&2
            exit 1
          fi
          echo "accepted a non-empty token"

      # The wiring: that action.yml actually runs the guard. Weak on its own, since the
      # scan step would fail here anyway, so it is paired with the assertions above.
      - name: Scan with no token
        id: scan
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: ''

      - name: Assert the action refused
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an empty sonar-token to fail the action, got: $OUTCOME" >&2
            exit 1
          fi

  # Unit-tests the JDK probe against the JDKs the hosted image exports as
  # JAVA_HOME_<n>_X64, plus a fabricated pre-9 layout for the 1.8.0 version format. Driving
  # each case through the action instead would cost a scan attempt per case and could only
  # read the verdict indirectly, out of JAVA_HOME.
  jdk-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the probe compares the feature version
        run: |
          set -euo pipefail
          probe=sonar/scan/jdk-satisfied.sh
          output="$(mktemp)"

          assert() {
            local expected="$1" requested="$2" home="$3" label="$4"
            : > "$output"
            GITHUB_OUTPUT="$output" REQUESTED="$requested" JAVA_HOME="$home" bash "$probe"
            if ! grep -qx "satisfied=$expected" "$output"; then
              echo "expected satisfied=$expected for $label, got: $(cat "$output")" >&2
              exit 1
            fi
            echo "$label: satisfied=$expected"
          }

          # A pre-9 JDK reports JAVA_VERSION="1.8.0_462". Fabricated rather than taken from
          # the image, so the parser stays covered when the image drops Java 8.
          legacy="$(mktemp -d)"
          mkdir -p "$legacy/bin"
          printf 'JAVA_VERSION="1.8.0_462"\n' > "$legacy/release"
          : > "$legacy/bin/java"
          chmod +x "$legacy/bin/java"

          assert true "25" "$JAVA_HOME_25_X64" "the requested feature version"
          assert true "8" "$legacy" "a pre-9 JAVA_VERSION"
          assert false "21" "$JAVA_HOME_25_X64" "a newer JDK than requested"
          assert false "25" "$JAVA_HOME_17_X64" "an older JDK than requested"
          assert false "21.0.x" "$JAVA_HOME_21_X64" "a range the probe does not evaluate"
          assert false "25" "/nonexistent" "a JAVA_HOME holding no JDK"

          : > "$output"
          GITHUB_OUTPUT="$output" REQUESTED=25 env -u JAVA_HOME bash "$probe"
          if ! grep -qx "satisfied=false" "$output"; then
            echo "expected satisfied=false for an unset JAVA_HOME, got: $(cat "$output")" >&2
            exit 1
          fi
          echo "an unset JAVA_HOME: satisfied=false"

  # The wiring, as three calls in one job and in this order: setup-java sets JAVA_HOME for
  # every later step, so each call starts from what the one before it left. Every scan step
  # fails against the discard port, so JAVA_HOME after the action is the signal rather than
  # the action's outcome.
  java-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage JAVA_HOME at JDK 25
        run: echo "JAVA_HOME=$JAVA_HOME_25_X64" >> "$GITHUB_ENV"

      - name: Scan on the staged JDK
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: a-token
          java-version: '25'

      - name: Assert the staged JDK was kept
        run: |
          set -euo pipefail
          if [[ "$JAVA_HOME" != "$JAVA_HOME_25_X64" ]]; then
            echo "expected the staged JDK 25 to be kept, got JAVA_HOME: $JAVA_HOME" >&2
            exit 1
          fi
          echo "$JAVA_HOME"

      - name: Scan with no java-version
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: a-token

      - name: Assert the default replaced it with JDK 21
        env:
          EXPECTED: '21.'
        run: |
          set -euo pipefail
          reported="$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)"
          if [[ "$reported" != *"\"$EXPECTED"* ]]; then
            echo "expected JDK $EXPECTED on JAVA_HOME, got: $reported" >&2
            exit 1
          fi
          echo "$reported"

      - name: Scan on an explicit java-version
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: a-token
          java-version: '25'

      # A feature release reports a bare `"25"`, where 21 reports `"21.0.13"`, so the two
      # assertions match on different patterns.
      - name: Assert the request installed JDK 25
        env:
          EXPECTED: '25'
        run: |
          set -euo pipefail
          reported="$("$JAVA_HOME/bin/java" -version 2>&1 | head -1)"
          if [[ "$reported" != *"\"$EXPECTED"* ]]; then
            echo "expected JDK $EXPECTED on JAVA_HOME, got: $reported" >&2
            exit 1
          fi
          if [[ "$JAVA_HOME" == "$JAVA_HOME_25_X64" ]]; then
            echo "expected a tool-cache install, got the staged JAVA_HOME: $JAVA_HOME" >&2
            exit 1
          fi
          echo "$reported"

  sonar-scan-tests-pass:
    if: always()
    needs:
      - token-required
      - jdk-probe
      - java-version
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" != "false" || "$CANCELLED" != "false" ]]; then
            echo "sonar/scan tests did not all pass (failed=$FAILED cancelled=$CANCELLED)" >&2
            exit 1
          fi

name: sonar/scan test

# Exercises the sonar/scan composite action's token guard. That is the whole of what this
# workflow can assert offline.
#
# It does NOT test the Java version, and no job here runs an analysis. With JRE
# provisioning skipped the scanner enforces its own floor against the JDK the action
# supplies, and only a real scan evaluates that. sonarcloud.yml is therefore the acceptance
# test: it runs this same action against this repository on every pull request with a real
# token, and it is what fails when SonarSource raises the floor again - as happened at
# sonarqube-scan-action 8.4.0, when the bundled SonarScanner CLI moved to 21 and broke three
# repositories. An offline assertion on `java -version` cannot do that job: it reports green
# whatever the scanner would have made of that JDK.
#
# SONAR_HOST_URL points every job at the discard port on localhost, so the scanner's first
# call fails to connect and nothing leaves the runner - no token is needed, no SonarCloud
# project is written to, and a fork pull request can reach nothing.
#
# That guaranteed failure is also why the token guard is tested by running its script
# directly: an assertion on the action's outcome cannot distinguish a rejected token from
# the connection failure that follows a good one.
#
# Deliberately NOT path-filtered. These tests gate the merge via the
# sonar-scan-tests-pass job below, and a path-filtered workflow cannot do that: when the
# filter excludes a PR its checks stay Pending rather than passing, so a required check
# over a filtered workflow deadlocks the pull request permanently.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Port 9 is discard. The scanner fails to connect here before it would reach
  # SonarCloud, which keeps the suite offline and fast. Job-level env reaches a composite
  # action's own steps, which is how this takes effect inside the action.
  SONAR_HOST_URL: http://127.0.0.1:9

jobs:
  # GitHub does not enforce `required: true` for a composite action's inputs, so this
  # asserts the action's own guard. Without it an unset secret reaches the scanner as an
  # empty string and fails as a SonarCloud credentials error instead of a workflow one.
  #
  # The guard's script is run directly here. Asserting on the action's outcome would prove
  # nothing on its own: the discard port fails the scan step for every token, so the
  # action's outcome is failure either way. The step after it covers the wiring.
  token-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the guard rejects an empty token
        run: |
          set -euo pipefail
          guard=sonar/scan/require-token.sh
          expected="sonar/scan: sonar-token is empty - pass the SONAR_TOKEN secret."

          # Unset, empty and whitespace-only must all be refused; a value must pass.
          for token in '__unset__' '' '   '; do
            if [[ "$token" == '__unset__' ]]; then
              set +e; stderr="$(env -u SONAR_TOKEN bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label='unset'
            else
              set +e; stderr="$(SONAR_TOKEN="$token" bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label="'$token'"
            fi
            if [[ "$status" -ne 1 ]]; then
              echo "expected the guard to exit 1 for a $label token, got: $status" >&2
              exit 1
            fi
            if [[ "$stderr" != *"$expected"* ]]; then
              echo "expected the guard's message on stderr for a $label token, got: $stderr" >&2
              exit 1
            fi
            echo "refused a $label token: $stderr"
          done

          if ! SONAR_TOKEN=a-token bash "$guard"; then
            echo "the guard rejected a non-empty token" >&2
            exit 1
          fi
          echo "accepted a non-empty token"

      # The wiring: that action.yml actually runs the guard. Weak on its own, since the
      # scan step would fail here anyway, so it is paired with the assertions above.
      - name: Scan with no token
        id: scan
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: ''

      - name: Assert the action refused
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an empty sonar-token to fail the action, got: $OUTCOME" >&2
            exit 1
          fi

  sonar-scan-tests-pass:
    if: always()
    needs:
      - token-required
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" != "false" || "$CANCELLED" != "false" ]]; then
            echo "sonar/scan tests did not all pass (failed=$FAILED cancelled=$CANCELLED)" >&2
            exit 1
          fi

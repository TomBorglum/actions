name: sonar/scan test

# Exercises the sonar/scan composite action: that the JDK it sets up is the one later
# steps in the caller's job see, and that an empty sonar-token fails loudly instead of
# reaching the scanner as an empty string.
#
# What this suite does NOT prove is that the scanner accepts that JDK. No analysis runs
# here, so the Java floor is never evaluated. sonarcloud.yml is the acceptance test: it
# runs this same action against this repository on every pull request with a real token,
# and it is what would catch a repeat of the regression that broke three repositories at
# sonarqube-scan-action 8.4.0, when the bundled SonarScanner CLI raised its floor to 21.
# Proving the scanner's behaviour offline would need a stub SonarCloud host, which is not
# worth standing up.
#
# SONAR_HOST_URL points every job at the discard port on localhost, so the scanner's first
# call fails to connect and nothing leaves the runner - no token is needed, no SonarCloud
# project is written to, and a fork pull request can reach nothing. The scan step is
# therefore expected to fail, which is why the job that asserts on the JDK carries
# continue-on-error and asserts afterwards.
#
# That same guaranteed failure is why the token guard is tested by running its script
# directly: an assertion on the action's outcome cannot distinguish a rejected token from
# the connection failure that follows a good one.
#
# Deliberately NOT path-filtered. These tests gate the merge via the
# sonar-scan-tests-pass job below, and a path-filtered workflow cannot do that: when the
# filter excludes a PR its checks stay Pending rather than passing, so a required check
# over a filtered workflow deadlocks the pull request permanently.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Port 9 is discard. The scanner fails to connect here before it would reach
  # SonarCloud, which keeps the suite offline and fast. Job-level env reaches a composite
  # action's own steps, which is how this takes effect inside the action.
  SONAR_HOST_URL: http://127.0.0.1:9

jobs:
  # The action hardcodes the floor SonarSource enforces, 21 since 2026-07-20.
  jdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Recorded before the action so the assertion below can tell a working action from
      # an image that already defaults to 21. ubuntu-24.04 defaults to Temurin 17, which
      # is what makes the assertion mean anything; when that changes this job stops
      # discriminating and says so rather than passing in silence.
      - name: Record the image's default JDK
        id: before
        run: |
          set -euo pipefail
          version="$(java -version 2>&1 | head -1)"
          echo "image default: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Scan with the action's JDK
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: dummy-token-no-analysis-is-performed

      # A SEPARATE step on purpose: this is what proves the action's JDK is visible to the
      # rest of the caller's job, not merely inside the action. CONTRIBUTING.md names that
      # as the thing to test, and it is what the scanner actually reads via JAVA_HOME.
      - name: Assert later steps see JDK 21
        env:
          BEFORE: ${{ steps.before.outputs.version }}
        run: |
          set -euo pipefail
          version="$(java -version 2>&1 | head -1)"
          echo "$version"
          if [[ "$version" != *'"21.'* ]]; then
            echo "expected a Java 21 runtime after the action, got: $version" >&2
            exit 1
          fi
          if [[ -z "${JAVA_HOME:-}" ]]; then
            echo "JAVA_HOME was not exported to later steps" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME"
          if [[ "$BEFORE" == *'"21.'* ]]; then
            drift="The runner image now defaults to Java 21, so this job no longer proves"
            drift="$drift the action supplied it. Assert on JAVA_HOME's path instead, or"
            drift="$drift point the action at a version the image does not default to."
            echo "::warning::$drift"
          fi

  # GitHub does not enforce `required: true` for a composite action's inputs, so this
  # asserts the action's own guard. Without it an unset secret reaches the scanner as an
  # empty string and fails as a SonarCloud credentials error instead of a workflow one.
  #
  # The guard's script is run directly here. Asserting on the action's outcome would prove
  # nothing on its own: the discard port fails the scan step for every token, so the
  # action's outcome is failure either way. The step after it covers the wiring.
  token-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the guard rejects an empty token
        run: |
          set -euo pipefail
          guard=sonar/scan/require-token.sh
          expected="sonar/scan: sonar-token is empty - pass the SONAR_TOKEN secret."

          # Unset, empty and whitespace-only must all be refused; a value must pass.
          for token in '__unset__' '' '   '; do
            if [[ "$token" == '__unset__' ]]; then
              set +e; stderr="$(env -u SONAR_TOKEN bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label='unset'
            else
              set +e; stderr="$(SONAR_TOKEN="$token" bash "$guard" 2>&1 >/dev/null)"; status=$?; set -e
              label="'$token'"
            fi
            if [[ "$status" -ne 1 ]]; then
              echo "expected the guard to exit 1 for a $label token, got: $status" >&2
              exit 1
            fi
            if [[ "$stderr" != *"$expected"* ]]; then
              echo "expected the guard's message on stderr for a $label token, got: $stderr" >&2
              exit 1
            fi
            echo "refused a $label token: $stderr"
          done

          if ! SONAR_TOKEN=a-token bash "$guard"; then
            echo "the guard rejected a non-empty token" >&2
            exit 1
          fi
          echo "accepted a non-empty token"

      # The wiring: that action.yml actually runs the guard. Weak on its own, since the
      # scan step would fail here anyway, so it is paired with the assertions above.
      - name: Scan with no token
        id: scan
        continue-on-error: true
        uses: ./sonar/scan
        with:
          sonar-token: ''

      - name: Assert the action refused
        env:
          OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an empty sonar-token to fail the action, got: $OUTCOME" >&2
            exit 1
          fi

  sonar-scan-tests-pass:
    if: always()
    needs:
      - jdk
      - token-required
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" != "false" || "$CANCELLED" != "false" ]]; then
            echo "sonar/scan tests did not all pass (failed=$FAILED cancelled=$CANCELLED)" >&2
            exit 1
          fi

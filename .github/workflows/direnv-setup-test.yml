name: direnv/setup test

# Exercises the direnv/setup composite action end to end: that it installs a runtime
# declared in an .envrc and exposes it to *subsequent* steps (proving the $GITHUB_PATH /
# $GITHUB_ENV export, not just a transient direnv shell), that a name set by a stock
# directive travels just as far as one set by a use_* directive, that an undefined
# directive is an error rather than a silent no-op, that stub-directives neutralises one
# without exporting anything or accepting an injected name, that both cache entries key as
# documented, and that the action fails when there is no .envrc to act on.
#
# Deliberately NOT path-filtered. These tests gate the merge via the direnv-setup-tests-pass job
# below, and a path-filtered workflow cannot do that: when the filter excludes a PR its
# checks stay Pending rather than passing, so a required check over a filtered workflow
# deadlocks the pull request permanently. Running always is cheap because the action's own
# toolchain cache entry rotates weekly rather than per commit - within a week every
# toolchain dir is an exact-key hit and each directive's install guard skips its download.
# cache-disabled pays a full install on every run, which is the point of that job.
#
# No secrets are used anywhere here, so a fork pull request running this at
# contents: read can reach nothing.
#
# Adding a directive to the action means adding a fixture .envrc under
# direnv/setup/test/ that exercises it end to end - install plus cross-step propagation -
# and adding its job to direnv-setup-tests-pass's needs: below. A job left out of needs:
# runs but gates nothing.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the sdk fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-sdk

      - name: Assert the runtime propagated to later steps
        run: |
          set -euo pipefail
          # Each SDKMAN candidate exposes its bin on PATH and its <CANDIDATE>_HOME
          # (SDKMAN's convention), pinned to the version the .envrc declares.
          #
          # The exact paths matter: sdkman-init.sh sets <CANDIDATE>_HOME to the floating
          # candidates/<c>/current symlink, and use_sdk overwrites it with the declared
          # version. Reading .../java/current here would mean that overwrite was lost.
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}  MAVEN_HOME=${MAVEN_HOME:-<unset>}"
          test "${JAVA_HOME:-}"  = "$HOME/.sdkman/candidates/java/21.0.2-tem"
          test "${MAVEN_HOME:-}" = "$HOME/.sdkman/candidates/maven/3.9.9"
          java -version
          command -v java | grep -q "$HOME/.sdkman/candidates/java/"
          mvn -version
          command -v mvn | grep -q "$HOME/.sdkman/candidates/maven/"

  activate-fnm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the fnm fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-fnm

      - name: Assert the runtime propagated to later steps
        run: |
          set -euo pipefail
          # fnm exposes the node bin on PATH, pinned to the version the .envrc declares.
          # Resolving node here (a later step) proves the $GITHUB_PATH export, not just a
          # transient direnv shell.
          node --version
          test "$(node --version)" = "v22.14.0"
          command -v node | grep -q "$HOME/.fnm/node-versions/v22.14.0/"

  activate-pixi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the pixi fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-pixi

      - name: Assert the runtime propagated to later steps
        run: |
          set -euo pipefail
          # pixi exposes the workspace's default-env bin on PATH. Resolving python
          # here (a later step) to that env proves the $GITHUB_PATH export, not just
          # a transient direnv shell. pixi itself is also exposed from ~/.pixi/bin.
          #
          # Assert the pixi VERSION, not merely that pixi runs: the whole point of
          # `use pixi <version>` is that the runner gets the version the .envrc pins,
          # and a bare `pixi --version` call would pass against any of them.
          test "$(pixi --version)" = "pixi 0.81.0"
          command -v pixi | grep -q "$HOME/.pixi/bin/"
          python --version
          command -v python | grep -q "/direnv/setup/test/fixture-pixi/.pixi/envs/default/bin/"

      # The fixture commits a pixi.lock, so the directive installs with --locked, which
      # verifies the lockfile against the manifest rather than updating it. A clean tree
      # is what proves it did not rewrite the committed lockfile. --untracked-files=all
      # because the default summarises an untracked directory as a single entry.
      - name: Assert --locked did not rewrite the lockfile
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "the pixi fixture modified the checkout:" >&2
            git status --porcelain --untracked-files=all >&2
            exit 1
          fi

  # `use pixi` needs its version: without one, pixi's installer would fall back to
  # whatever is latest that day (install.sh does VERSION="${PIXI_VERSION:-latest}") and
  # the runner would silently diverge from the pin the .envrc declares. This asserts the
  # directive refuses instead - the mandatory-argument check is the only validation it
  # does, so nothing else would catch a refactor that dropped it.
  pixi-version-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against an .envrc with an unversioned use pixi
        id: run
        continue-on-error: true
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-pixi-unpinned

      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an unversioned 'use pixi' to fail the action, got: $OUTCOME" >&2
            exit 1
          fi

  activate-dotenv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the dotenv fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-dotenv

      - name: Assert the stock directives propagated to later steps
        run: |
          set -euo pipefail
          # The only fixture with no use_* directive: it uses stock `export` and
          # `dotenv_if_exists`, which put names in direnv's environment and write to
          # neither $GITHUB_PATH nor $GITHUB_ENV themselves. Reading them here, in a
          # later step, is the whole point - nothing but the action's own export can
          # have carried them.
          echo "PLAIN=${SETUP_DIRENV_PLAIN:-<unset>}  DOTENV=${SETUP_DIRENV_DOTENV:-<unset>}"
          test "${SETUP_DIRENV_PLAIN:-}"  = "from-envrc"
          test "${SETUP_DIRENV_DOTENV:-}" = "from-dotenv"
          test "${SETUP_DIRENV_TRICKY:-}" = "a=b c"

          # What the heredoc delimiter is for, and the only assertion here that a plain
          # "key=value" append would fail. The value spans three lines and its middle
          # line is itself shaped like an assignment, so writing it unquoted would end
          # SETUP_DIRENV_MULTI after "first line" and hand the runner the next line as a
          # variable of its own.
          printf 'MULTI=[%s]\n' "${SETUP_DIRENV_MULTI:-<unset>}"
          test "${SETUP_DIRENV_MULTI:-}" = $'first line\nSETUP_DIRENV_FORGED=nope\nlast line'
          test -z "${SETUP_DIRENV_FORGED:-}"
          # direnv's own bookkeeping is not job state, and must not have been carried.
          test -z "${DIRENV_DIFF:-}"
          test -z "${DIRENV_FILE:-}"

  # The stub-directives input, which replaced the two hardcoded no-op directives
  # (use_sonarqube_mcp, use_claude_env) this action carried when it lived in
  # wsl-cloud-init. The fixture declares both, with and without arguments.
  stub-directives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the stub fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-stub
          stub-directives: sonarqube_mcp claude_env

      - name: Assert the stubs exported nothing
        run: |
          set -euo pipefail
          # A stub must succeed and contribute nothing. These names are what the real
          # workstation directives would have set, so finding either here would mean a
          # stub had grown an effect.
          echo "SONARQUBE_TOKEN=${SONARQUBE_TOKEN:-<unset>}  SONARQUBE_ORG=${SONARQUBE_ORG:-<unset>}"
          test -z "${SONARQUBE_TOKEN:-}"
          test -z "${SONARQUBE_ORG:-}"

      - name: Assert the stubs wrote nothing into the checkout
        run: |
          set -euo pipefail
          # Inherited from the old activate-claude-env job, which existed because the
          # workstation use_claude_env writes a .claude/settings.json. A file appearing
          # here would dirty the tree for later steps in a consumer's job.
          git status --porcelain --untracked-files=all > /tmp/stub-status
          if [[ -s /tmp/stub-status ]]; then
            echo "a stubbed directive modified the checkout:" >&2
            cat /tmp/stub-status >&2
            exit 1
          fi

  # The negative twin of the job above, and the test for the strict `use` override.
  # direnv's own stdlib `use` calls use_<name> with no check, so an undefined directive is
  # a "command not found" it does not treat as fatal - left alone, this fixture would pass
  # with nothing installed. That is what the override turns into an error, and it is what
  # makes stub-directives mean something: this job fails if the strictness is ever lost.
  stub-directives-omitted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the stub fixture with no stub-directives
        id: run
        continue-on-error: true
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-stub

      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an undefined directive to fail the action, got: $OUTCOME" >&2
            exit 1
          fi

  # stub-directives reaches a generated function definition, so the action constrains
  # each name to a bare identifier. This asserts the rejection *and* that nothing ran -
  # a validation that failed after the fact would still have executed the payload.
  stub-directives-rejected:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup with an injected stub name
        id: run
        continue-on-error: true
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-stub
          stub-directives: 'foo; touch /tmp/pwned'

      - name: Assert the name was rejected and nothing executed
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected an invalid stub name to fail the action, got: $OUTCOME" >&2
            exit 1
          fi
          if [[ -e /tmp/pwned ]]; then
            echo "the injected command executed despite the step failing" >&2
            exit 1
          fi

  # The only arm64 job, and the only thing that exercises install-direnv.sh's aarch64
  # branch - its pinned checksum would otherwise never be verified by anything, on the
  # deps: bump PR least of all. It reuses the dotenv fixture deliberately: proving the
  # install and the export is the point here, and no use_* directive means no toolchain
  # download to go flaky on a less-used runner image.
  install-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the dotenv fixture
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-dotenv

      - name: Assert the arm64 direnv installed and exported
        run: |
          set -euo pipefail
          # Pinned, so assert the version: a silent drift back to whatever the runner
          # image carries is what this catches.
          direnv version | grep -qx "$(grep -oP '^VERSION=\K.*' direnv/setup/install-direnv.sh)"
          command -v direnv | grep -qx /usr/local/bin/direnv
          test "${SETUP_DIRENV_PLAIN:-}"  = "from-envrc"
          test "${SETUP_DIRENV_DOTENV:-}" = "from-dotenv"

  missing-envrc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Point at a directory that has no .envrc (.github is never a direnv root).
      - name: Run direnv/setup where there is no .envrc
        id: run
        continue-on-error: true
        uses: ./direnv/setup
        with:
          working-directory: .github

      - name: Assert the action failed
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected direnv/setup to fail on a missing .envrc, got: $OUTCOME" >&2
            exit 1
          fi

  # A wrong key fails silently: a colliding one reports cache-hit: true having restored none of
  # the caller's paths, and a restore-keys rung that is not a prefix of its own key never
  # matches. Run the script directly, so every case is asserted without a cache round trip.
  cache-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert the key shape and the digest's inputs
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          # Output file per case, so each assertion reads back its own keys.
          keys() {
            local case=$1 working_directory=$2 cache_paths=$3
            GITHUB_OUTPUT="$out/$case" WORKING_DIRECTORY="$working_directory" \
              CACHE_PATHS="$cache_paths" RUNNER_OS=Linux RUNNER_ARCH=X64 \
              bash direnv/setup/cache-keys.sh
          }
          val() {
            local case=$1 field=$2
            grep -m1 "^$field=" "$out/$case" | cut -d= -f2-
          }

          cargo=$'target\n.pixi/envs\n~/.cargo/registry'
          # The same set, reordered and padded, which must digest identically: a consumer
          # tidying the YAML list must not cold-start the lineage.
          reordered=$'  ~/.cargo/registry  \n\ntarget\n  .pixi/envs\n'

          keys base . "$cargo"
          keys reordered . "$reordered"
          keys nested apps/api "$cargo"
          keys extra . "$cargo"$'\n~/.cargo/git'
          keys empty . ""
          keys nested-empty apps/api ""

          week="$(date -u '+w%U')"
          month="$(date -u '+%Y-%m')"

          # The shape itself. Each digest precedes the rotating segments, which is what puts
          # it in the fallback rung below and keeps one lineage from prefix-matching another.
          tools_key="$(val base tools-key)"
          paths_key="$(val base paths-key)"
          echo "tools-key=$tools_key paths-key=$paths_key"
          test "$tools_key" = "direnv-setup-tools-$(val base tools-digest)-Linux-X64-$month-$week"
          test "$paths_key" = "direnv-setup-paths-$(val base digest)-Linux-X64-$month-$week"
          [[ "$(val base tools-digest)" =~ ^[0-9a-f]{12}$ ]]
          [[ "$(val base digest)" =~ ^[0-9a-f]{12}$ ]]

          # Each rung is a prefix of its own key, and ends after the month, so a month's
          # fallback cannot reach into the month before it.
          for entry in tools paths; do
            key="$(val base "$entry-key")"
            rung="$(val base "$entry-restore-keys")"
            test "$rung" = "${key%-$week}-"
            test "$rung" = "${rung%-$month-}-$month-"
            [[ "$key" == "$rung"* ]]
          done

          # What the paths digest is and is not sensitive to.
          test "$(val reordered digest)" = "$(val base digest)"
          test "$(val nested digest)" != "$(val base digest)"
          test "$(val extra digest)" != "$(val base digest)"
          test "$(val empty digest)" != "$(val base digest)"

          # The toolchain lineage separates on working-directory and on nothing else. Without
          # the first, every job in a repository shares one toolchain entry: whichever saves
          # first owns it, and a job whose .envrc declares a different toolchain restores that
          # entry, installs from scratch, and is refused the save for the rest of the window.
          test "$(val nested tools-digest)" != "$(val base tools-digest)"
          test "$(val reordered tools-digest)" = "$(val base tools-digest)"
          test "$(val extra tools-digest)" = "$(val base tools-digest)"
          test "$(val empty tools-digest)" = "$(val base tools-digest)"
          test "$(val nested-empty tools-digest)" = "$(val nested tools-digest)"

          # An unset cache-paths still has to yield a well-formed key: the action computes
          # both keys unconditionally and only the cache steps are gated on the input.
          [[ "$(val empty paths-key)" =~ ^direnv-setup-paths-[0-9a-f]{12}-Linux-X64-[0-9]{4}-[0-9]{2}-w[0-9]{2}$ ]]

  # The cache-paths input end to end, including a path no fixture creates and the reporting
  # step that runs inside the action and would fail it.
  cache-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run direnv/setup against the pixi fixture with cache-paths
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-pixi
          # ~/.cargo/registry is deliberately a path no fixture creates: a consumer's list
          # routinely names a directory the job has not produced yet, and neither the cache
          # step nor the reporting step may fail on it.
          cache-paths: |
            direnv/setup/test/fixture-pixi/.pixi/envs
            ~/.cargo/registry

      - name: Assert the runtime still propagated to later steps
        run: |
          set -euo pipefail
          # activate-pixi's assertion, repeated to prove cache-paths changed nothing about
          # activation.
          test "$(pixi --version)" = "pixi 0.81.0"
          python --version
          command -v python | grep -q "/direnv/setup/test/fixture-pixi/.pixi/envs/default/bin/"

      - name: Assert nothing was written into the checkout
        run: |
          set -euo pipefail
          # .pixi/ is gitignored by the fixture's own workspace, so a tracked-file change
          # here would mean a cache path had been restored over the checkout.
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "caching with cache-paths modified tracked files:" >&2
            git status --porcelain >&2
            exit 1
          fi

  # The only job that installs a toolchain rather than restoring one. Every other job gets a
  # warm entry after the week's first run, so each directive's install-dir guard skips its
  # download and the installer goes unverified - the gap install-arm64 closes for
  # install-direnv.sh. README.md states why cache: 'false' is the only lever for it.
  cache-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unconditional, so the install below is cold whatever the runner image ships.
      - name: Remove the toolchain dirs
        run: |
          set -euo pipefail
          rm -rf ~/.sdkman ~/.fnm ~/.pixi
          test ! -e ~/.pixi

      - name: Run direnv/setup against the pixi fixture with caching off
        uses: ./direnv/setup
        with:
          working-directory: direnv/setup/test/fixture-pixi
          cache: 'false'

      - name: Assert the toolchain was installed rather than restored
        run: |
          set -euo pipefail
          # ~/.pixi was removed above and no cache step ran, so its presence is the
          # installer's work and the version proves the pin reached the download.
          test -d ~/.pixi
          test "$(pixi --version)" = "pixi 0.81.0"
          python --version
          command -v python | grep -q "/direnv/setup/test/fixture-pixi/.pixi/envs/default/bin/"

  # The required status check for this action, and the only job name the main-protection
  # ruleset needs to know. Listing all nine above would be nine entries to keep in sync,
  # and a renamed job would quietly stop gating; this aggregate fails closed instead.
  #
  # The name carries the action's prefix because a required context is matched by NAME:
  # two workflows whose aggregates were both called `tests-pass` would leave one required
  # context standing for two different check runs, and GitHub documents no rule for which
  # of them it then gates on. One context per workflow, each matching exactly one job.
  #
  # ANY JOB ADDED ABOVE MUST BE ADDED TO needs: - a job left out runs but gates nothing.
  #
  # `if: always()` is load-bearing: without it this job is skipped when an upstream job
  # fails, and a skipped job reports Success, so the gate would pass precisely when it
  # should not.
  direnv-setup-tests-pass:
    if: always()
    needs:
      - activate-sdk
      - activate-fnm
      - activate-pixi
      - pixi-version-required
      - activate-dotenv
      - stub-directives
      - stub-directives-omitted
      - stub-directives-rejected
      - install-arm64
      - missing-envrc
      - cache-keys
      - cache-paths
      - cache-disabled
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [[ "$FAILED" != "false" || "$CANCELLED" != "false" ]]; then
            echo "direnv/setup tests did not all pass (failure=$FAILED cancelled=$CANCELLED)" >&2
            exit 1
          fi

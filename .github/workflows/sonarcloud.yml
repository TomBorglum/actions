name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so SonarCloud can attribute issues to the right commits.
          fetch-depth: 0
      # The working tree's own action rather than a pinned release, so this scan doubles
      # as the action's end-to-end test: sonar-scan-test.yml deliberately performs no
      # analysis, and this is the only job that proves a real one still works. A change
      # that breaks the action therefore fails on its own pull request.
      #
      # The JDK and the skipJreProvisioning argument now live in sonar/scan/action.yml.
      # That is also what moves their Dependabot bumps from `ci:` to `deps:`, since a
      # published action.yml ships to consumers where .github/workflows does not.
      - name: SonarQube Cloud Scan
        uses: ./sonar/scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

version: 2
updates:
  # CI-only actions: the ones this repo's own workflows run. "ci", not "deps" - these
  # execute on this repo's runners and never reach a consumer, so their bumps must not
  # cut a release. release-please treats "ci" as a hidden, non-releasable type.
  #
  # The "/" directory is special-cased by Dependabot's github-actions fetcher: it
  # scans .github/workflows/*.y(a)ml AND a root-level action.yml. Since every action
  # here lives in its own subdirectory, nothing consumer-facing is ever caught by this
  # entry - see CONTRIBUTING.md, "Never put an action.yml at the repository root".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Dependabot appends the colon and space itself, so this yields "ci: ..." -
      # a subject release-please parses.
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Consumer-facing actions: the ones referenced inside a published action.yml. These run
  # on *consumers'* runners, so bumping one changes what they execute and must cut a patch
  # release - hence "deps", not "ci". Dependabot only fetches a directory's own
  # action.yml, so each action needs listing - including one nested under a domain
  # directory such as /direnv, which is an ordinary path here and needs no special
  # handling.
  #
  # Listed individually rather than as "/direnv/*". `directories` does expand globs, but
  # dependabot-core routes them through an experiment flag, and a glob that silently
  # expands to nothing is the exact failure this entry exists to prevent: the pins stop
  # being updated and nothing says so.
  #
  # The cooldown is the difference that matters: a "deps" bump republishes to other
  # people's workflows, so leave upstream time to withdraw a bad or compromised
  # release before it ships onward. The "ci" entry above needs none - a bad bump there
  # breaks only this repo's CI, and sooner is better for a security fix.
  #
  # One window, not three. The semver-major/minor/patch-days keys parse fine but have
  # no effect for github-actions: its update checker resolves a single
  # `latest_version_tag_respecting_cooldown` and never branches on bump type, so only
  # default-days is honoured. Setting the per-bump-type keys here would read as policy
  # while doing nothing - worse than not having them. Same conclusion, and the same
  # wording, as TomBorglum/workflows reached in "ci: use default-days for the Dependabot
  # cooldown".
  #
  # Seven days: long enough that a withdrawn or compromised release has surfaced,
  # short enough not to sit on a routine fix for a month.
  #
  # The direnv version pinned in direnv/setup/install-direnv.sh is NOT covered here -
  # Dependabot cannot track a version in a shell script. update-direnv.yml does that,
  # and opens its PR with the same "deps" prefix for the same reason.
  - package-ecosystem: "github-actions"
    directories: ["/direnv/setup", "/direnv/upgrade-pixi", "/pixi/upgrade-dependencies"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
